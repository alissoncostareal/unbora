<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="unbora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e26a4e" />
      <stop offset="50%" stop-color="#c8563c" />
      <stop offset="100%" stop-color="#8a301c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#unbora-grad)" />

  <!-- Inner subtle glow border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />

  <!-- Unbora 'U' & Location Discovery Pin Silhouette -->
  <g filter="url(#shadow)">
    <!-- Modern 'U' Glyph -->
    <path
      d="M156 128
         C156 114.7 166.7 104 180 104
         C193.3 104 204 114.7 204 128
         V260
         C204 288.7 227.3 312 256 312
         C284.7 312 308 288.7 308 260
         V128
         C308 114.7 318.7 104 332 104
         C345.3 104 356 114.7 356 128
         V260
         C356 315.2 311.2 360 256 360
         C200.8 360 156 315.2 156 260
         Z"
      fill="#FFFFFF"
    />

    <!-- Compass / Discovery Sparkle Dot inside U -->
    <circle cx="256" cy="188" r="28" fill="#FFFFFF" />
    
    <!-- Pulse pointer dot beneath U base -->
    <circle cx="256" cy="404" r="16" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
