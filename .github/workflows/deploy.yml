# Pipeline automático de Deploy do Unbora
# Dispara automaticamente a cada push na branch main.
# Executa o CI do backend e em seguida conecta via SSH na VPS (173.212.242.9)
# para publicar o Unbora no cluster k3s.

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: unbora-deploy-prod
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Package
        run: chmod +x mvnw && ./mvnw -B -DskipTests package

  deploy-production:
    name: Deploy production
    needs: [backend-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy on VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::Secret VPS_SSH_KEY ausente no environment production."
            exit 1
          fi
          b64() { printf '%s' "$1" | base64 | tr -d '\n'; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 173.212.242.9 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            "root@173.212.242.9" \
            "GROQ_API_KEY_B64='$(b64 "${GROQ_API_KEY:-}")' BRAVE_API_KEY_B64='$(b64 "${BRAVE_API_KEY:-}")' GOOGLE_PLACES_API_KEY_B64='$(b64 "${GOOGLE_PLACES_API_KEY:-}")' VITE_GOOGLE_MAPS_API_KEY_B64='$(b64 "${VITE_GOOGLE_MAPS_API_KEY:-}")' VITE_GOOGLE_CLIENT_ID_B64='$(b64 "${VITE_GOOGLE_CLIENT_ID:-}")' SUPERADMIN_EMAIL_B64='$(b64 "${SUPERADMIN_EMAIL:-}")' SUPERADMIN_PASSWORD_B64='$(b64 "${SUPERADMIN_PASSWORD:-}")' ADMIN_JWT_SECRET_B64='$(b64 "${ADMIN_JWT_SECRET:-}")' bash -s" \
            < deploy/vps/deploy.sh
