server:
  port: ${PORT:3001}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: unbora-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29094}}
    listener:
      # Consumidor só sobe onde o broker resolve (na VPS). O produtor usa unbora.kafka.enabled.
      auto-startup: ${UNBORA_KAFKA_CONSUMER_ENABLED:false}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

unbora:
  mail:
    from: ${MAIL_FROM:nao-responda@unbora.com.br}
  app-url: ${APP_FRONTEND_URL:https://unbora.com.br}
  # URL pública HTTPS da API (fotos: {base}/api/media/p/{id}). Em local pode ficar vazio.
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  # false no Render (sem Kafka). true no docker-compose / k8s.
  kafka:
    enabled: ${UNBORA_KAFKA_ENABLED:false}
    consumer-enabled: ${UNBORA_KAFKA_CONSUMER_ENABLED:false}
  jwt:
    secret: ${ADMIN_JWT_SECRET:${JWT_SECRET:unbora-super-secret-jwt-key-minimum-256-bits-for-security-must-be-long-enough-12345}}
    expiration-ms: 2592000000
  superadmin:
    email: ${SUPERADMIN_EMAIL:}
    password: ${SUPERADMIN_PASSWORD:}
    name: ${SUPERADMIN_NAME:Super Admin}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
  llm-fallback:
    api-key: ${LLM_FALLBACK_API_KEY:}
    base-url: ${LLM_FALLBACK_BASE_URL:}
    model: ${LLM_FALLBACK_MODEL:llama3.2:3b}
  brave:
    api-key: ${BRAVE_API_KEY:}
  google:
    places-api-key: ${GOOGLE_PLACES_API_KEY:${GOOGLE_MAPS_API_KEY:}}
  openai:
    api-key: ${OPENAI_API_KEY:}
  oauth:
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:${EXPO_PUBLIC_GOOGLE_CLIENT_ID:}}}
  cors:
    allowed-origin: ${ALLOWED_ORIGIN:*}
