<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4a1a10" />
      <stop offset="50%" stop-color="#1e1815" />
      <stop offset="100%" stop-color="#12100e" />
    </radialGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a59" />
      <stop offset="100%" stop-color="#9a4632" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <rect x="44" y="44" width="1112" height="542" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

  <!-- Top Badge -->
  <g transform="translate(84, 88)">
    <rect x="0" y="0" width="360" height="34" fill="#7c2f1d" />
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#ffffff" text-transform="uppercase">CURADORIA URBANA &amp; GASTRONOMIA</text>
  </g>

  <!-- Logo Mark -->
  <g transform="translate(84, 150)">
    <!-- Unbora U icon in container -->
    <rect x="0" y="0" width="76" height="76" fill="#ffffff" />
    <path d="M 22,18 C 22,16.5 23.5,15 25,15 L 32,15 C 33.5,15 35,16.5 35,18 L 35,42 C 35,45.5 37.8,48.5 41.5,48.5 C 45.2,48.5 48,45.5 48,42 L 48,18 C 48,16.5 49.5,15 51,15 L 58,15 C 59.5,15 61,16.5 61,18 L 61,42 C 61,52.5 52.3,61 41.5,61 C 30.7,61 22,52.5 22,42 Z" fill="#12100e" />
    <circle cx="41.5" cy="69" r="3" fill="#12100e" />

    <!-- Brand Name Text -->
    <text x="96" y="55" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="4" fill="#ffffff">UNBORA</text>
  </g>

  <!-- Main Headline -->
  <text x="84" y="300" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="44" font-weight="300" letter-spacing="-0.5" fill="#ffffff">Onde ir, a partir de</text>
  <text x="84" y="354" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5" fill="url(#terracottaGrad)">como você quer se sentir.</text>

  <!-- Subtitle Paragraph -->
  <text x="84" y="420" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="20" font-weight="400" fill="#d1c6b8">Descubra restaurantes, bares, cafeterias e rolês na sua cidade.</text>
  <text x="84" y="450" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="20" font-weight="400" fill="#9e9185">Recomendações inteligentes em tempo real com fotos, notas e o motivo da escolha.</text>

  <!-- Bottom Badges / Features -->
  <g transform="translate(84, 514)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="32" fill="#1e1815" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#e8dcd5">ED. FORTALEZA</text>
    </g>
    <g transform="translate(176, 0)">
      <rect x="0" y="0" width="180" height="32" fill="#1e1815" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#e8dcd5">IA EM TEMPO REAL</text>
    </g>
    <g transform="translate(372, 0)">
      <rect x="0" y="0" width="190" height="32" fill="#1e1815" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#e8dcd5">ACESSO GRATUITO</text>
    </g>
  </g>

  <!-- Right Side Callout / Domain -->
  <g transform="translate(900, 522)">
    <text x="216" y="16" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#ffffff">unbora.com.br</text>
  </g>
</svg>