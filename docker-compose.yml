services:
  # ── Apache Kafka (KRaft mode - No Zookeeper needed) ───────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: unbora-kafka
    hostname: kafka
    ports:
      - '29092:9092'
      - '29094:9094'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unbora-net

  # ── Kafka UI Dashboard (Provectus) ───────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: unbora-kafka-ui
    ports:
      - '8085:8080'
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'unbora-local-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:9092'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - unbora-net

  # ── Unbora Backend (Spring Boot 3.4) ─────────────────────────
  # Executado opcionalmente no Docker. Por padrão no desenvolvimento local,
  # rode o backend via IDE / ./mvnw spring-boot:run na porta 3001.
  # Para subir o backend no Docker: docker compose --profile backend up -d
  backend:
    profiles:
      - backend
      - full
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unbora-backend
    ports:
      - '${PORT:-3001}:3001'
    env_file:
      - .env
    environment:
      PORT: 3001
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 'kafka:9092'
      UNBORA_KAFKA_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - unbora-net

networks:
  unbora-net:
    driver: bridge
