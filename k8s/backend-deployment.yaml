apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbora-backend
  namespace: unbora
  labels:
    app: unbora-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: unbora-backend
  template:
    metadata:
      labels:
        app: unbora-backend
    spec:
      containers:
        - name: unbora-api
          image: unbora-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: unbora-backend-config
            - secretRef:
                name: unbora-backend-secret
          resources:
            requests:
              cpu: "250m"
              memory: "350Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
