apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbora-backend
  namespace: unbora
  labels:
    app: unbora-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unbora-backend
  template:
    metadata:
      labels:
        app: unbora-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres.unbora.svc.cluster.local 5432; do sleep 2; done
      containers:
        - name: unbora-api
          image: docker.io/library/unbora-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: unbora-backend-config
            - secretRef:
                name: unbora-backend-secret
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
