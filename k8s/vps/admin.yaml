apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbora-admin
  namespace: unbora
  labels:
    app: unbora-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unbora-admin
  template:
    metadata:
      labels:
        app: unbora-admin
    spec:
      containers:
        - name: admin
          image: docker.io/library/unbora-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_API_BASE_URL
              value: https://api.unbora.com.br
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: unbora-admin-service
  namespace: unbora
  labels:
    app: unbora-admin
spec:
  type: ClusterIP
  selector:
    app: unbora-admin
  ports:
    - name: http
      port: 3002
      targetPort: http
