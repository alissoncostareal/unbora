apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: unbora-ratelimit
  namespace: unbora
spec:
  rateLimit:
    average: 30
    burst: 60
    period: 1m
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unbora-ingress
  namespace: unbora
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: unbora-unbora-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: unbora.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unbora-web-service
                port:
                  number: 80
    - host: www.unbora.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unbora-web-service
                port:
                  number: 80
    - host: admin.unbora.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unbora-admin-service
                port:
                  number: 3002
    - host: business.unbora.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unbora-business-service
                port:
                  number: 3003
    - host: api.unbora.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unbora-backend-service
                port:
                  number: 3001
    - host: unbora.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unbora-web-service
                port:
                  number: 80
    - host: www.unbora.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unbora-web-service
                port:
                  number: 80
    - host: admin.unbora.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unbora-admin-service
                port:
                  number: 3002
    - host: business.unbora.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unbora-business-service
                port:
                  number: 3003
    - host: api.unbora.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unbora-backend-service
                port:
                  number: 3001
